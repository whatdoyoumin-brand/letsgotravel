<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Let's go travel - 도트 UI 데모</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #2b2b3d;
    font-family: 'Press Start 2P', monospace;
    padding: 16px;
  }

  /* 게임 화면 전체를 고정 비율 컨테이너로 감싼다 */
  .game-frame {
    width: 100%;
    max-width: 480px;
    aspect-ratio: 3 / 4;
    background: #0f0f1a;
    border: 6px solid #050508;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 0 0 3px #3a3a52;
  }

  /* 상단 씬 영역 - 오브젝트만 등장 */
  .scene {
    flex: 1;
    position: relative;
    background: #263a5c;
    display: flex;
    align-items: center;
    justify-content: center;
    image-rendering: pixelated;
  }

  .scene::after {
    /* 바닥 라인 - 방 느낌만 최소한으로 */
    content: "";
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 22%;
    background: #4a3826;
    border-top: 4px solid #2e2216;
  }

  /* 침대 오브젝트 - 픽셀 블록으로 구성 */
  .bed {
    position: relative;
    width: 140px;
    height: 80px;
    z-index: 1;
  }
  .bed-frame {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 56px;
    background: #7a4a2b;
    border: 4px solid #3d2513;
  }
  .bed-sheet {
    position: absolute;
    bottom: 12px;
    left: 4px;
    right: 4px;
    height: 36px;
    background: #4a7fc9;
    border: 4px solid #2c4f7c;
  }
  .bed-pillow {
    position: absolute;
    bottom: 30px;
    left: 10px;
    width: 34px;
    height: 20px;
    background: #eef1f6;
    border: 4px solid #b9c0cc;
  }

  /* 가방 위 여권 오브젝트 (클릭 대상은 아니고 장식용) */
  .passport {
    position: absolute;
    top: 22%;
    right: 20%;
    width: 26px;
    height: 34px;
    background: #a83232;
    border: 3px solid #5c1a1a;
    box-shadow: 0 0 0 2px #f2c94c inset;
  }

  /* 대사창 영역 */
  .dialogue-box {
    background: #f4f1e6;
    border-top: 6px solid #050508;
    padding: clamp(10px, 3vw, 16px);
    display: flex;
    flex-direction: column;
    gap: clamp(8px, 2.5vw, 14px);
  }

  .dialogue-text {
    font-size: clamp(10px, 3vw, 13px);
    line-height: 1.7;
    color: #23231f;
    min-height: 2.6em;
  }

  .choices {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .choice-btn {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(9px, 2.6vw, 11px);
    text-align: left;
    padding: 12px 14px;
    min-height: 44px;
    background: #ffffff;
    border: 3px solid #23231f;
    color: #23231f;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .choice-btn:hover {
    background: #ffe9a8;
  }

  .choice-btn:active {
    transform: translateY(1px);
  }

  .cursor {
    opacity: 0;
    transition: opacity 0.1s;
  }

  .choice-btn:hover .cursor {
    opacity: 1;
  }

  .status {
    font-size: 9px;
    color: #7a7a6f;
    text-align: center;
  }

  .result-banner {
    font-size: clamp(10px, 3vw, 12px);
    text-align: center;
    padding: 10px;
    border: 3px solid #23231f;
    display: none;
  }
  .result-banner.fail {
    background: #f7c1c1;
    color: #791f1f;
  }
  .result-banner.success {
    background: #c0dd97;
    color: #27500a;
  }
  .result-banner.show {
    display: block;
  }
</style>
</head>
<body>

<div class="game-frame">
  <div class="scene">
    <div class="bed">
      <div class="bed-frame"></div>
      <div class="bed-sheet"></div>
      <div class="bed-pillow"></div>
    </div>
    <div class="passport"></div>
  </div>

  <div class="dialogue-box">
    <div class="dialogue-text" id="dialogueText">내일은 여행을 떠나는 날입니다.</div>

    <div class="result-banner" id="resultBanner"></div>

    <div class="choices" id="choices">
      <button class="choice-btn" onclick="choose('sleep')">
        <span class="cursor">▶</span> 자러 간다
      </button>
      <button class="choice-btn" onclick="choose('check')">
        <span class="cursor">▶</span> 자러 가지 않는다
      </button>
    </div>

    <div class="status">Stage 01 · D-1 밤 10시</div>
  </div>
</div>

<script>
  function choose(option) {
    const banner = document.getElementById('resultBanner');
    const dialogue = document.getElementById('dialogueText');
    const choices = document.getElementById('choices');

    if (option === 'sleep') {
      dialogue.textContent = '공항에 도착해서 여권을 안 챙긴 걸 알았습니다.';
      banner.textContent = 'GAME OVER';
      banner.className = 'result-banner fail show';
    } else {
      dialogue.textContent = '다시 한번 짐을 확인하던 당신은 가방에 여권이 없는 걸 알아차렸습니다.';
      banner.textContent = '다음 단계로';
      banner.className = 'result-banner success show';
    }
    choices.style.display = 'none';
  }
</script>

</body>
</html>
